<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Suivi Tension</title>
<meta name="description" content="Noter la tension artérielle et le pouls de la famille. Les données restent sur l'appareil.">
<meta name="theme-color" content="#0F5F63">
<link rel="manifest" href="./manifest.webmanifest">
<link rel="icon" type="image/png" sizes="192x192" href="./icon-192.png">
<link rel="apple-touch-icon" href="./apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Tension">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:ital,wght@0,400;0,700;1,400&display=swap">
<style>
:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
body{margin:0}
img{max-width:100%}
[hidden]{display:none!important}
</style>
<style>
/* Layout : une colonne façon téléphone (max 520px), gros boutons au pouce, une vue à la fois */
:root{
  --bg:#F3F5F7; --card:#FFFFFF; --fg:#1B2430; --muted:#4A5563; --line:#DCE2E8; --soft:#E4E8EC;
  --accent:#0F5F63; --accent-fg:#FFFFFF;
  --sys:#0F5F63; --dia:#4C6FBF; --pulse:#A4532A; --grid:#E4E8EC;
  --ok-bg:#E3F2EA; --ok-fg:#1E5B3A; --warn-bg:#FDF0DC; --warn-fg:#6E3C00;
  --crit-bg:#FBE3E1; --crit-fg:#8E1F17; --low-bg:#E6ECF8; --low-fg:#2B4384;
  --z-green:#2F9E5B; --z-yellow:#E8B90E; --z-red:#CC3B2F;
  --font:'Atkinson Hyperlegible', system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
  --r:18px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#11161B; --card:#1A2128; --fg:#E8EDF2; --muted:#A9B3BE; --line:#2E3843; --soft:#232B33;
  --accent:#4FB3B3; --accent-fg:#08201F;
  --sys:#5CC2C0; --dia:#8FAEF0; --pulse:#E3A27A; --grid:#26303A;
  --ok-bg:#183A29; --ok-fg:#9FDDB9; --warn-bg:#3D2A10; --warn-fg:#F4C98A;
  --crit-bg:#451A17; --crit-fg:#F6AFA8; --low-bg:#1E2A47; --low-fg:#AFC2F2;
  --z-green:#46B874; --z-yellow:#F0C93A; --z-red:#E2574B;
  color-scheme:dark;
}}
:root[data-theme="dark"]{
  --bg:#11161B; --card:#1A2128; --fg:#E8EDF2; --muted:#A9B3BE; --line:#2E3843; --soft:#232B33;
  --accent:#4FB3B3; --accent-fg:#08201F;
  --sys:#5CC2C0; --dia:#8FAEF0; --pulse:#E3A27A; --grid:#26303A;
  --ok-bg:#183A29; --ok-fg:#9FDDB9; --warn-bg:#3D2A10; --warn-fg:#F4C98A;
  --crit-bg:#451A17; --crit-fg:#F6AFA8; --low-bg:#1E2A47; --low-fg:#AFC2F2;
  --z-green:#46B874; --z-yellow:#F0C93A; --z-red:#E2574B;
  color-scheme:dark;
}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--fg);font-family:var(--font);font-size:18px;line-height:1.4;
  padding-left:max(16px, env(safe-area-inset-left, 0px));padding-right:max(16px, env(safe-area-inset-right, 0px));padding-block:16px 96px}
.app{max-width:520px;margin:0 auto;display:flex;flex-direction:column;gap:14px}
h1,h2{margin:0;text-wrap:balance;line-height:1.15}
h1{font-size:30px} h2{font-size:22px}
p{margin:0}
button,input,select,textarea{font-family:inherit;font-size:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.muted{color:var(--muted)}
.small{font-size:16px}
.num{font-variant-numeric:tabular-nums}

.top{display:flex;align-items:center;justify-content:space-between;gap:12px;min-height:48px}
.brand{display:flex;align-items:center;gap:8px;font-weight:700;color:var(--accent);font-size:18px}
.who{display:flex;align-items:center;gap:8px;min-height:48px;padding:4px 14px 4px 4px;border:2px solid var(--line);background:var(--card);border-radius:999px;font-weight:700;font-size:18px}
.av{flex-shrink:0;border-radius:50%;color:#FFFFFF;display:flex;align-items:center;justify-content:center;font-weight:700}
.av.s{width:36px;height:36px;font-size:18px}
.av.l{width:72px;height:72px;font-size:32px}

.card{background:var(--card);border-radius:var(--r);padding:18px}
.stack{display:flex;flex-direction:column;gap:10px}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.chip{display:inline-flex;align-self:flex-start;border-radius:999px;padding:5px 12px;font-size:16px;font-weight:700}
.c-ok{background:var(--ok-bg);color:var(--ok-fg)}
.c-high{background:var(--warn-bg);color:var(--warn-fg)}
.c-crit{background:var(--crit-bg);color:var(--crit-fg)}
.c-low{background:var(--low-bg);color:var(--low-fg)}

.big{font-size:56px;font-weight:700;line-height:1;font-variant-numeric:tabular-nums}
.big .sl{color:var(--muted);font-weight:400}

.btn{min-height:56px;border-radius:16px;border:2px solid var(--line);background:var(--card);font-weight:700;font-size:19px;display:flex;align-items:center;justify-content:center;gap:10px;padding:8px 16px;text-align:center}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-fg);min-height:64px;font-size:23px}
.btn.outline{border-color:var(--accent);color:var(--accent)}
.btn.danger{border-color:var(--crit-fg);color:var(--crit-fg)}
.btn.danger.solid{background:var(--crit-fg);color:var(--card)}
.btn.sm{min-height:44px;font-size:17px;border-radius:12px}
.link{background:none;border:none;padding:0;min-height:44px;font-weight:700;color:var(--accent);font-size:18px;display:inline-flex;align-items:center;gap:6px}
.grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}

.seg{display:grid;grid-auto-flow:column;grid-auto-columns:1fr;gap:4px;background:var(--soft);border-radius:14px;padding:4px}
.seg button{min-height:44px;border:none;border-radius:10px;background:transparent;font-weight:700;font-size:17px;color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--card);color:var(--fg)}

.banner{border-radius:16px;padding:14px 16px;display:flex;flex-direction:column;gap:10px}
.banner strong{font-size:19px}

/* Saisie */
.field{background:var(--card);border:2px solid var(--line);border-radius:var(--r);padding:12px 18px;display:flex;align-items:center;justify-content:space-between;gap:12px}
.field:focus-within{border-color:var(--accent);border-width:3px;padding:11px 17px}
.field label{display:flex;flex-direction:column;font-weight:700;font-size:22px}
.field label span{font-weight:400;font-size:16px;color:var(--muted)}
.field .val{display:flex;align-items:baseline;gap:6px}
.field input{width:110px;border:none;background:transparent;font-size:48px;font-weight:700;text-align:right;padding:0;font-variant-numeric:tabular-nums}
.field input:focus{outline:none}
.field .u{font-size:14px;color:var(--muted)}
.dt{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.dt input{min-height:44px;border:2px solid var(--line);border-radius:12px;background:var(--card);padding:4px 10px;font-size:17px}
details.more{background:var(--card);border-radius:var(--r);padding:4px 18px}
details.more summary{min-height:52px;display:flex;align-items:center;font-weight:700;color:var(--accent);cursor:pointer;list-style:none}
details.more summary::-webkit-details-marker{display:none}
details.more[open]{padding-bottom:16px}
.opts{display:flex;flex-wrap:wrap;gap:8px}
.opts input{position:absolute;opacity:0;width:1px;height:1px}
.opts label{min-height:44px;display:inline-flex;align-items:center;padding:6px 14px;border:2px solid var(--line);border-radius:999px;font-size:17px;cursor:pointer}
.opts input:checked + label{border-color:var(--accent);background:var(--accent);color:var(--accent-fg);font-weight:700}
.opts input:focus-visible + label{outline:3px solid var(--accent);outline-offset:2px}
.lbl{font-weight:700;font-size:17px}
textarea,.txt{width:100%;border:2px solid var(--line);border-radius:12px;background:var(--card);padding:10px 12px;font-size:17px}
textarea{min-height:90px;resize:vertical}

/* Graphique */
svg.ch{width:100%;height:auto;display:block}
svg.ch .grid{stroke:var(--grid);stroke-width:1}
svg.ch .tgt{stroke:var(--muted);stroke-width:1.5;stroke-dasharray:4 4;opacity:.8}
svg.ch text{fill:var(--muted);font-size:12px;font-family:var(--font)}
svg.ch .l{fill:none;stroke-width:3;stroke-linejoin:round;stroke-linecap:round}
.l-sys{stroke:var(--sys)} .l-dia{stroke:var(--dia);stroke-dasharray:7 4} .l-pul{stroke:var(--pulse);stroke-width:2 !important;stroke-dasharray:2 4}
.d-sys{fill:var(--sys)} .d-dia{fill:var(--dia)} .d-pul{fill:var(--pulse)}
.legend{display:flex;flex-wrap:wrap;gap:6px 16px;font-size:15px;color:var(--muted)}
.legend span{display:inline-flex;align-items:center;gap:6px}
.legend svg line{stroke-width:3}
.empty{color:var(--muted);font-size:17px;padding:24px 4px;text-align:center}

/* Historique */
.day{font-weight:700;font-size:17px;color:var(--muted);padding-top:6px;text-transform:capitalize}
.hrow{background:var(--card);border-radius:14px;padding:12px 14px;display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.hrow .v{font-size:26px;font-weight:700;font-variant-numeric:tabular-nums}
.hrow .meta{flex:1;min-width:0;display:flex;flex-direction:column;gap:2px}
.z-green{background:var(--z-green)} .z-yellow{background:var(--z-yellow)} .z-red{background:var(--z-red)}
.c-red{background:var(--crit-bg);color:var(--crit-fg)}
.lastrow{display:flex;gap:12px;align-items:flex-start}
.lastrow .big{font-size:50px}
.thermo{flex-shrink:0;display:flex;gap:8px;align-items:flex-start;padding-top:4px}
.th-scale{display:flex;flex-direction:column;align-items:center}
.th-tube{position:relative;width:22px;height:150px;border-radius:11px 11px 0 0;display:flex;flex-direction:column;box-shadow:inset 0 0 0 2px var(--line)}
.th-seg:first-child{border-radius:11px 11px 0 0}
.th-seg.z-red{flex:25}.th-seg.z-yellow{flex:25}.th-seg.z-green{flex:50}
.th-mark{position:absolute;left:-7px;right:-7px;height:6px;border-radius:3px;background:var(--fg);box-shadow:0 0 0 2px var(--card);transform:translateY(50%)}
.th-mark::before{content:"";position:absolute;left:-10px;top:50%;transform:translateY(-50%);border:7px solid transparent;border-left:9px solid var(--fg);border-right:0}
.th-bulb{width:36px;height:36px;border-radius:50%;margin-top:-4px;box-shadow:0 0 0 3px var(--card)}
.th-labels{position:relative;width:78px;height:150px}
.th-labels span{position:absolute;left:0;transform:translateY(50%);display:flex;flex-direction:column;font-size:12px;line-height:1.15;color:var(--muted)}
.th-labels b{font-size:13px;color:var(--fg)}
.zdot{display:inline-block;width:14px;height:14px;border-radius:50%;flex-shrink:0;box-shadow:0 0 0 2px var(--card)}
.zbar{display:flex;height:14px;border-radius:7px;overflow:hidden;gap:2px}
@media (max-width:370px){.th-labels{width:64px}.lastrow .big{font-size:42px}}
.hrow .sub{width:100%;display:flex;flex-direction:column;gap:2px;border-top:1px solid var(--line);padding-top:4px}
.srow{display:flex;align-items:center;gap:6px 12px;flex-wrap:wrap;font-size:16px}
.srow .del{margin-left:auto}
.timer{font-size:52px;font-weight:700;color:var(--accent);font-variant-numeric:tabular-nums;line-height:1.1}
.timer.done{font-size:30px}
.del{min-height:44px;min-width:44px;border:none;background:none;color:var(--muted);border-radius:10px;display:flex;align-items:center;justify-content:center}
.confirm{width:100%;display:flex;gap:8px;flex-wrap:wrap}

/* Profils */
.tile{display:flex;flex-direction:column;align-items:center;gap:10px;background:var(--card);border:2px solid var(--line);border-radius:20px;padding:22px 10px;font-weight:700;font-size:21px;text-align:center}
.tile.cur{border-color:var(--accent);border-width:3px}
.tile .sub{font-weight:400;font-size:16px;color:var(--muted)}
.tile.add{background:transparent;border-style:dashed;color:var(--muted);justify-content:center}
.colors{display:flex;gap:10px;flex-wrap:wrap}
.colors input{position:absolute;opacity:0;width:1px;height:1px}
.colors label{width:48px;height:48px;border-radius:50%;border:3px solid transparent;cursor:pointer;box-shadow:inset 0 0 0 3px var(--card)}
.colors input:checked + label{border-color:var(--fg)}
.colors input:focus-visible + label{outline:3px solid var(--accent);outline-offset:2px}

table.rep{width:100%;border-collapse:collapse;font-size:16px;font-variant-numeric:tabular-nums}
table.rep th,table.rep td{padding:8px 6px;border-bottom:1px solid var(--line);text-align:left}
table.rep th{color:var(--muted);font-weight:700}
.tw{overflow-x:auto}
.kv{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.kv div{display:flex;flex-direction:column}
.kv b{font-size:24px;font-variant-numeric:tabular-nums}

.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(20px + env(safe-area-inset-bottom, 0px));background:var(--ok-bg);color:var(--ok-fg);border-radius:14px;padding:14px 18px;font-weight:700;font-size:18px;display:flex;align-items:center;gap:10px;box-shadow:0 6px 24px rgba(0,0,0,.18);max-width:calc(100% - 32px);z-index:20}
.foot{font-size:15px;color:var(--muted);text-align:center;padding-top:8px}
@media (prefers-reduced-motion: no-preference){.toast{animation:up .25s ease-out}@keyframes up{from{transform:translate(-50%,12px);opacity:0}}}
</style>
</head>
<body>
<div class="app" id="app"></div>
<div class="toast" id="toast" role="status" hidden></div>

<script>
(function(){
const KEY='suivi-tension-v1';
const COLORS=['#0F5F63','#8A4B00','#3B4FA0','#7A3E7A','#2F6B2F'];
const DAY=864e5;
let S, storageOK=true;
let view='home', range=14, repRange=30, showPulse=false, pending=null, entryWarned=false, addOpen=false, critShow=false, entryDraft=null;
let sess=null, tm=null; // séance en cours : {pid, count, restUntil}

const $=s=>document.querySelector(s);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const uid=()=>Math.random().toString(36).slice(2,9)+Date.now().toString(36).slice(-4);
const avg=a=>a.length?a.reduce((x,y)=>x+y,0)/a.length:0;
const rnd=Math.round;

function seed(){
  const pid=uid(), rs=[], now=new Date();
  for(let d=13;d>=0;d--){for(const h of [8,20]){
    const t=new Date(now); t.setDate(now.getDate()-d); t.setHours(h,(d*7)%40+5,0,0);
    if(t>now) continue;
    const tr=(13-d)*0.5;
    const s1=rnd(139-tr+(h===20?-3:0)+((d*37+h)%7)-3), d1=rnd(88-tr*0.4+(h===20?-2:0)+((d*17+h)%5)-2), p1=68+((d*13+h)%9)-4;
    rs.push({id:uid(),pid,ts:t.getTime(),sys:s1,dia:d1,pulse:p1,arm:'',pos:'',note:''});
    const t2=t.getTime()+75e3;
    if(t2<=now.getTime()) rs.push({id:uid(),pid,ts:t2,sys:s1-2-((d+h)%3),dia:d1-1-((d*3+h)%2),pulse:p1-2,arm:'',pos:'',note:''});
  }}
  return {profiles:[{id:pid,name:'Jeanne',rel:'Exemple',color:COLORS[0]}],readings:rs,current:pid,sample:true,perSession:2};
}
function load(){
  try{const raw=localStorage.getItem(KEY); if(raw){S=JSON.parse(raw); if(S&&Array.isArray(S.profiles)) return;}}
  catch(e){storageOK=false}
  S=seed();
}
function save(){try{localStorage.setItem(KEY,JSON.stringify(S));storageOK=true}catch(e){storageOK=false}}

const prof=()=>S.profiles.find(p=>p.id===S.current)||S.profiles[0];
const readingsOf=pid=>S.readings.filter(r=>r.pid===pid).sort((a,b)=>a.ts-b.ts);
const GAP=10*6e4; // mesures à moins de 10 minutes d'écart = même séance
function sessionsOf(pid){
  const out=[];
  readingsOf(pid).forEach(r=>{const g=out[out.length-1]; if(g&&r.ts-g.items[g.items.length-1].ts<=GAP) g.items.push(r); else out.push({items:[r]});});
  out.forEach(g=>{const it=g.items, pu=it.filter(r=>r.pulse).map(r=>r.pulse);
    g.ts=it[0].ts; g.sys=rnd(avg(it.map(r=>r.sys))); g.dia=rnd(avg(it.map(r=>r.dia))); g.pulse=pu.length?rnd(avg(pu)):null; g.n=it.length;
    g.note=it.map(r=>r.note).filter(Boolean).join(' · ');});
  return out;
}
const sessionWith=(pid,id)=>sessionsOf(pid).find(g=>g.items.some(r=>r.id===id));
const perSess=()=>[1,2,3].includes(S.perSession)?S.perSession:2;
const detail=g=>g.items.map(r=>`${r.sys}/${r.dia}`).join(' et ');

function cat(s,d){
  if(s>=180||d>=120) return {k:'crit',z:'red',t:'Très élevée : à revérifier'};
  if(s>=160||d>=100) return {k:'red',z:'red',t:'Élevée'};
  if(s>=135||d>=85) return {k:'high',z:'yellow',t:'Au-dessus de la cible'};
  if(s<90||d<60) return {k:'low',z:'green',t:'Basse'};
  return {k:'ok',z:'green',t:'Dans la cible (moins de 135/85)'};
}
/* Thermomètre : vert 0–50 %, jaune 50–75 %, rouge 75–100 %. La valeur la plus défavorable (haut ou bas) décide. */
function lerp(v,pts){
  if(v<=pts[0][0]) return pts[0][1];
  for(let i=1;i<pts.length;i++) if(v<=pts[i][0]) return pts[i-1][1]+(v-pts[i-1][0])/(pts[i][0]-pts[i-1][0])*(pts[i][1]-pts[i-1][1]);
  return pts[pts.length-1][1];
}
const gaugePos=(s,d)=>Math.max(3,Math.min(97,Math.max(lerp(s,[[90,0],[135,50],[160,75],[200,100]]),lerp(d,[[60,0],[85,50],[100,75],[130,100]]))));
const ZNAME={green:'vert',yellow:'jaune',red:'rouge'};
function thermo(s,d){
  const c=cat(s,d), pos=gaugePos(s,d).toFixed(1);
  return `<div class="thermo" role="img" aria-label="Indicateur ${ZNAME[c.z]} : ${c.t}">
    <div class="th-scale">
      <div class="th-tube"><div class="th-seg z-red"></div><div class="th-seg z-yellow"></div><div class="th-seg z-green"></div><div class="th-mark" style="bottom:${pos}%"></div></div>
      <div class="th-bulb z-${c.z}"></div>
    </div>
    <div class="th-labels" aria-hidden="true">
      <span style="bottom:87.5%"><b>Élevée</b>160/100+</span>
      <span style="bottom:62.5%"><b>Au-dessus</b>135/85</span>
      <span style="bottom:25%"><b>Cible</b>sous 135/85</span>
    </div>
  </div>`;
}
const fDay=ts=>new Date(ts).toLocaleDateString('fr-CA',{weekday:'long',day:'numeric',month:'long'});
const fShort=ts=>new Date(ts).toLocaleDateString('fr-CA',{day:'numeric',month:'short'});
const fTime=ts=>new Date(ts).toLocaleTimeString('fr-CA',{hour:'2-digit',minute:'2-digit'});
function rel(ts){
  const a=new Date(); a.setHours(0,0,0,0); const b=new Date(ts); b.setHours(0,0,0,0);
  const n=rnd((a-b)/DAY);
  return n===0?"aujourd'hui":n===1?'hier':`il y a ${n} jours`;
}
const localDT=ts=>{const d=new Date(ts);return new Date(d-d.getTimezoneOffset()*6e4).toISOString().slice(0,16)};

const I={
  heart:'<svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20.8 4.6a5.5 5.5 0 0 0-7.8 0L12 5.7l-1-1.1a5.5 5.5 0 0 0-7.8 7.8l1 1.1L12 21l7.8-7.5 1-1.1a5.5 5.5 0 0 0 0-7.8z"/><path d="M3 12h4l2-3 3 6 2-3h7"/></svg>',
  plus:'<svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg>',
  back:'<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 5l-7 7 7 7"/></svg>',
  check:'<svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg>',

const av=(p,size)=>`<span class="av ${size}" style="background:${esc(p.color)}" aria-hidden="true">${esc((p.name||'?').trim().charAt(0).toUpperCase())}</span>`;
const backBtn=(to='home')=>`<button class="link" data-act="go" data-id="${to}">${I.back}Retour</button>`;

/* ---------- Graphique ---------- */
function chart(rs,days){
  const W=340,H=210,L=34,R=12,T=12,B=26;
  const end=new Date(); end.setHours(23,59,59,999);
  const start=new Date(end); start.setDate(end.getDate()-days+1); start.setHours(0,0,0,0);
  const by={};
  rs.filter(r=>r.ts>=start.getTime()).forEach(r=>{
    const d=new Date(r.ts), k=d.toDateString();
    (by[k]=by[k]||{t:new Date(d.getFullYear(),d.getMonth(),d.getDate(),12).getTime(),s:[],d:[],p:[]});
    by[k].s.push(r.sys); by[k].d.push(r.dia); if(r.pulse) by[k].p.push(r.pulse);
  });
  const pts=Object.values(by).sort((a,b)=>a.t-b.t).map(o=>({t:o.t,s:avg(o.s),d:avg(o.d),p:o.p.length?avg(o.p):null}));
  if(pts.length<2) return '<p class="empty">Le graphique apparaîtra dès qu\'il y aura des mesures sur au moins 2 jours de cette période.</p>';
  let lo=Math.min(80,...pts.map(p=>p.d)), hi=Math.max(140,...pts.map(p=>p.s));
  if(showPulse){const pp=pts.filter(p=>p.p).map(p=>p.p); if(pp.length){lo=Math.min(lo,...pp);hi=Math.max(hi,...pp)}}
  lo=Math.floor((lo-5)/10)*10; hi=Math.ceil((hi+5)/10)*10;
  const x=t=>L+(t-start.getTime())/(end.getTime()-start.getTime())*(W-L-R);
  const y=v=>T+(hi-v)/(hi-lo)*(H-T-B);
  const step=(hi-lo)>80?20:10;
  let g='';
  for(let v=lo;v<=hi;v+=step) g+=`<line class="grid" x1="${L}" x2="${W-R}" y1="${y(v).toFixed(1)}" y2="${y(v).toFixed(1)}"/><text x="${L-6}" y="${(y(v)+4).toFixed(1)}" text-anchor="end">${v}</text>`;
  for(const v of [135,85]) if(v>lo&&v<hi) g+=`<line class="tgt" x1="${L}" x2="${W-R}" y1="${y(v).toFixed(1)}" y2="${y(v).toFixed(1)}"/><text x="${W-R}" y="${(y(v)-5).toFixed(1)}" text-anchor="end">cible ${v}</text>`;
  const line=(k,c)=>{const q=pts.filter(p=>p[k]!=null); if(q.length<2) return ''; const last=q[q.length-1];
    return `<polyline class="l ${c}" points="${q.map(p=>x(p.t).toFixed(1)+','+y(p[k]).toFixed(1)).join(' ')}"/><circle class="${c.replace('l-','d-')}" cx="${x(last.t).toFixed(1)}" cy="${y(last[k]).toFixed(1)}" r="5"/>`};
  const f=pts[0], l=pts[pts.length-1];
  const label=`Moyennes par jour sur ${days} jours. Systolique de ${rnd(f.s)} à ${rnd(l.s)}, diastolique de ${rnd(f.d)} à ${rnd(l.d)}.`;
  return `<svg class="ch" viewBox="0 0 ${W} ${H}" role="img" aria-label="${label}">${g}
    ${line('s','l-sys')}${line('d','l-dia')}${showPulse?line('p','l-pul'):''}
    <text x="${L}" y="${H-6}">${fShort(start.getTime())}</text><text x="${W-R}" y="${H-6}" text-anchor="end">auj.</text></svg>`;
}

/* ---------- Vues ---------- */
function critBanner(){
  return critShow?`<div class="banner c-crit" role="alert"><div class="row" style="flex-wrap:nowrap;align-items:flex-start">${I.alert}<strong>Lecture très élevée (180/120 ou plus)</strong></div>
    <p class="small">Reposez-vous 5 minutes, assis, puis reprenez la mesure. Si elle reste aussi élevée, contactez un professionnel de la santé (Info-Santé 811 au Québec). <b>Appelez le 911</b> en cas de douleur à la poitrine, essoufflement, faiblesse, troubles de la vue ou de la parole.</p>
    <button class="btn sm danger" data-act="critOk">J'ai compris</button></div>`:'';
}
function vHome(){
  const p=prof(); const rs=sessionsOf(p.id); const last=rs[rs.length-1];
  let h='';
  if(!storageOK) h+=`<div class="banner c-high"><strong>Stockage indisponible</strong><p class="small">Ce navigateur ne garde pas les données (navigation privée ?). Les mesures seront perdues à la fermeture.</p></div>`;
  if(S.sample) h+=`<div class="banner c-low"><strong>Données d'exemple</strong><p class="small">Ces mesures servent à montrer l'app. Effacez-les pour commencer avec les vôtres.</p><button class="btn sm outline" data-act="removeSample">Effacer l'exemple et commencer</button></div>`;
  h+=critBanner();
  if(!last){
    h+=`<div class="card stack"><h2>Aucune mesure pour ${esc(p.name)}</h2><p class="muted">Prenez votre tension, puis touchez « Nouvelle mesure » pour noter les chiffres.</p></div>`;
  }else{
    const c=cat(last.sys,last.dia);
    const now=Date.now(), w=7*DAY;
    const a=rs.filter(r=>r.ts>now-w), b=rs.filter(r=>r.ts<=now-w&&r.ts>now-2*w);
    let sum='';
    if(a.length){
      sum=`Moyenne des 7 derniers jours : <strong class="num">${rnd(avg(a.map(r=>r.sys)))}/${rnd(avg(a.map(r=>r.dia)))}</strong> (${a.length} séance${a.length>1?'s':''})`;
      if(b.length){const df=rnd(avg(a.map(r=>r.sys))-avg(b.map(r=>r.sys)));
        sum+= df<=-2?`, soit ${-df} points de moins que la semaine précédente.`: df>=2?`, soit ${df} points de plus que la semaine précédente.`:', stable par rapport à la semaine précédente.';
      } else sum+='.';
    }
    h+=`<div class="card stack">
      <span class="muted small">${last.n>1?'Dernière séance':'Dernière mesure'} · ${rel(last.ts)} à ${fTime(last.ts)}</span>
      <div class="lastrow">
        <div class="stack" style="min-width:0;flex:1">
          <span class="big">${last.sys}<span class="sl">/</span>${last.dia}</span>
          ${last.pulse?`<span class="muted">pouls ${last.pulse}</span>`:''}
          ${last.n>1?`<span class="muted small num">Moyenne de ${last.n} mesures : ${detail(last)}</span>`:''}
          <span class="chip c-${c.k}">${c.t}</span>
        </div>
        ${thermo(last.sys,last.dia)}
      </div>
      ${sum?`<p style="border-top:1px solid var(--line);padding-top:12px">${sum}</p>`:''}
    </div>`;
    h+=`<div class="seg" role="group" aria-label="Période du graphique">${[7,14,30,90].map(d=>`<button data-act="range" data-id="${d}" aria-pressed="${range===d}">${d} j</button>`).join('')}</div>
    <div class="card stack" style="padding:14px">${chart(rs,range)}
      <div class="legend"><span><svg width="22" height="6" aria-hidden="true"><line x1="0" y1="3" x2="22" y2="3" class="l-sys"/></svg>Systolique (haut)</span><span><svg width="22" height="6" aria-hidden="true"><line x1="0" y1="3" x2="22" y2="3" class="l-dia"/></svg>Diastolique (bas)</span>${showPulse?`<span><svg width="22" height="6" aria-hidden="true"><line x1="0" y1="3" x2="22" y2="3" class="l-pul"/></svg>Pouls</span>`:''}</div>
      <button class="link" data-act="pulse" aria-pressed="${showPulse}">${showPulse?'Masquer le pouls':'Afficher aussi le pouls'}</button>
    </div>`;
    const inR=rs.filter(r=>r.ts>now-range*DAY), am=inR.filter(r=>new Date(r.ts).getHours()<12), pm=inR.filter(r=>new Date(r.ts).getHours()>=12);
    if(am.length&&pm.length) h+=`<div class="card"><div class="kv"><div><span class="muted small">Matin (${am.length})</span><b>${rnd(avg(am.map(r=>r.sys)))}/${rnd(avg(am.map(r=>r.dia)))}</b></div><div><span class="muted small">Après-midi et soir (${pm.length})</span><b>${rnd(avg(pm.map(r=>r.sys)))}/${rnd(avg(pm.map(r=>r.dia)))}</b></div></div></div>`;
  }
  h+=`<button class="btn primary" data-act="go" data-id="entry">${I.plus}Nouvelle mesure</button>
  <div class="grid2"><button class="btn" data-act="go" data-id="history">${I.list}Historique</button><button class="btn" data-act="go" data-id="report">${I.doc}Pour le médecin</button></div>
  <button class="link" data-act="go" data-id="backup" style="align-self:center">${I.save}Sauvegarde et réglages</button>
  <p class="foot">Cible à domicile : moins de 135/85, d'après Hypertension Canada. Cet outil sert au suivi et ne remplace pas l'avis d'un professionnel de la santé.</p>`;
  return h;
}

    <div class="field"><label for="dia">Diastolique<span>le chiffre du bas</span></label><div class="val"><input id="dia" inputmode="numeric" pattern="[0-9]*" maxlength="3" autocomplete="off" value="${d.dia||''}"><span class="u">mmHg</span></div></div>

function startTimer(){
  clearInterval(tm);
  const tick=()=>{const el=$('#timer'); if(!el||view!=='between'||!sess){clearInterval(tm);return}
    const left=Math.ceil((sess.restUntil-Date.now())/1000);
    if(left<=0){el.textContent="C'est le moment";el.classList.add('done');clearInterval(tm);return}
    el.textContent=`${Math.floor(left/60)}:${String(left%60).padStart(2,'0')}`;};
  tick(); tm=setInterval(tick,500);
}

function vHistory(){
  const p=prof(); const ss=sessionsOf(p.id).reverse();
  let h=`<div class="top">${backBtn()}<span class="row" style="gap:8px">${av(p,'s')}<b>${esc(p.name)}</b></span></div><h1>Historique</h1>`;
  if(!ss.length) return h+`<p class="empty">Aucune mesure pour l'instant.</p>`;
  let cur='';
  ss.forEach(g=>{
    const dk=fDay(g.ts); if(dk!==cur){cur=dk; h+=`<div class="day">${dk}</div>`}
    const c=cat(g.sys,g.dia);
    h+=`<div class="hrow"><span class="zdot z-${c.z}" title="Zone ${ZNAME[c.z]}"></span><span class="v">${g.sys}/${g.dia}</span><div class="meta"><span class="small">${fTime(g.ts)}${g.pulse?` · pouls ${g.pulse}`:''}${g.n>1?` · moyenne de ${g.n}`:''}</span><span class="chip c-${c.k}" style="font-size:14px;padding:2px 10px">${c.k==='ok'?'Dans la cible':c.t}</span></div>
      <div class="sub">${g.items.map(r=>{
        const det=[r.arm==='g'?'bras gauche':r.arm==='d'?'bras droit':'',r.pos,r.note].filter(Boolean).map(esc).join(' · ');
        return `<div class="srow"><span class="num muted">${fTime(r.ts)}</span><span class="num"><b>${r.sys}/${r.dia}</b>${r.pulse?` · pouls ${r.pulse}`:''}</span>
          ${pending==='del:'+r.id?`<div class="confirm"><button class="btn sm danger solid" data-act="delYes" data-id="${r.id}">Supprimer cette mesure</button><button class="btn sm" data-act="cancel">Annuler</button></div>`:`<button class="del" data-act="del" data-id="${r.id}" aria-label="Supprimer la mesure ${r.sys}/${r.dia} de ${fTime(r.ts)}">${I.trash}</button>`}
          ${det?`<span class="muted small" style="flex-basis:100%">${det}</span>`:''}</div>`}).join('')}</div></div>`;
  });
  return h;
}

function reportData(){
  const p=prof(); const since=Date.now()-repRange*DAY;
  const rs=sessionsOf(p.id).filter(g=>g.ts>=since);
  if(!rs.length) return {p,rs};
  const s=rs.map(r=>r.sys), d=rs.map(r=>r.dia), pu=rs.filter(r=>r.pulse).map(r=>r.pulse);
  const am=rs.filter(r=>new Date(r.ts).getHours()<12), pm=rs.filter(r=>new Date(r.ts).getHours()>=12);
  const m=a=>a.length?`${rnd(avg(a.map(r=>r.sys)))}/${rnd(avg(a.map(r=>r.dia)))}`:'–';
  const zc={green:0,yellow:0,red:0}; rs.forEach(g=>zc[cat(g.sys,g.dia).z]++);
  return {p,rs,zc,avgAll:m(rs),am:m(am),pm:m(pm),n:rs.length,nm:rs.reduce((x,g)=>x+g.n,0),pulse:pu.length?rnd(avg(pu)):null,
    maxS:Math.max(...s),minS:Math.min(...s),maxD:Math.max(...d),minD:Math.min(...d),
    over:rs.filter(r=>r.sys>=135||r.dia>=85).length,from:rs[0].ts,to:rs[rs.length-1].ts};
}
function reportText(R){
  let t=`Suivi de la tension artérielle : ${R.p.name}\nPériode : du ${fShort(R.from)} au ${fShort(R.to)} (${R.n} séances, ${R.nm} mesures)\n`;
  t+=`Chaque séance = moyenne des mesures prises à quelques minutes d'intervalle.\n\n`;
  t+=`Moyenne : ${R.avgAll} mmHg${R.pulse?`, pouls moyen ${R.pulse}`:''}\nMatin : ${R.am} · Après-midi et soir : ${R.pm}\n`;
  t+=`Systolique : de ${R.minS} à ${R.maxS} · Diastolique : de ${R.minD} à ${R.maxD}\nSéances à 135/85 ou plus : ${R.over} sur ${R.n}\nRépartition : ${R.zc.green} dans la cible (vert), ${R.zc.yellow} au-dessus de la cible (jaune), ${R.zc.red} élevées, 160/100 ou plus (rouge)\n\nDétail :\n`;
  R.rs.slice().reverse().forEach(g=>{t+=`${fShort(g.ts)} ${fTime(g.ts)}  ${g.sys}/${g.dia}${g.pulse?`  pouls ${g.pulse}`:''}${g.n>1?`  (moyenne de ${detail(g)})`:''}${g.note?`  [${g.note}]`:''}\n`});
  return t;
}

    <h2>Nouvelle personne</h2>
    <label class="lbl" for="pname">Prénom</label><input class="txt" id="pname" autocomplete="off" maxlength="30" style="min-height:52px;font-size:20px">
    <label class="lbl" for="prel">Lien (facultatif)</label><input class="txt" id="prel" placeholder="Ex. : Maman, Papa, Moi" maxlength="30" style="min-height:52px">
    <span class="lbl">Couleur</span><div class="colors">${COLORS.map((c,i)=>`<input type="radio" name="pcol" id="pc${i}" value="${c}"${i===S.profiles.length%COLORS.length?' checked':''}><label for="pc${i}" style="background:${c}" aria-label="Couleur ${i+1}"></label>`).join('')}</div>
    <p id="perr" class="small" style="color:var(--crit-fg)"></p>
    <button type="submit" class="btn primary">Ajouter</button></form>`;
  return h;
}

function vBackup(){
  let h=`<div class="top">${backBtn()}</div><h1>Sauvegarde et réglages</h1>
  <div class="card stack"><h2>Mesures par séance</h2><p class="small">L'app propose de prendre ce nombre de mesures à une minute d'intervalle, puis en fait la moyenne. Hypertension Canada recommande 2 mesures, matin et soir.</p>
    <div class="seg" role="group" aria-label="Mesures par séance">${[1,2,3].map(n=>`<button data-act="per" data-id="${n}" aria-pressed="${perSess()===n}">${n}</button>`).join('')}</div></div>
  <div class="card stack"><h2>Où sont mes données ?</h2><p class="small">Les mesures restent uniquement dans ce navigateur, sur cet appareil. Rien n'est envoyé sur internet. Si vous changez de téléphone ou effacez les données du navigateur, elles disparaissent : faites une copie de sauvegarde de temps en temps.</p></div>
  <div class="card stack"><h2>Faire une copie</h2><p class="small">Copie toutes les personnes et mesures. Collez ensuite le texte dans un courriel à vous-même ou dans une note.</p>
    <button class="btn outline" data-act="copyBackup">Copier la sauvegarde</button></div>
  <div class="card stack"><h2>Restaurer une copie</h2><label class="small" for="restoreTxt">Collez ici le texte d'une sauvegarde. Il remplacera les données actuelles.</label>
    <textarea id="restoreTxt" placeholder="Collez la sauvegarde ici"></textarea><p id="rerr" class="small" style="color:var(--crit-fg)"></p>
    ${pending==='restore'?`<div class="confirm"><button class="btn sm danger solid" data-act="restoreYes">Remplacer mes données</button><button class="btn sm" data-act="cancel">Annuler</button></div>`:`<button class="btn" data-act="restore">Restaurer</button>`}</div>
  <div class="card stack"><h2>Personnes</h2>`;
  S.profiles.forEach(p=>{h+=`<div class="row" style="justify-content:space-between">${av(p,'s')}<span style="flex:1;min-width:0">${esc(p.name)} <span class="muted small">(${readingsOf(p.id).length} mesures)</span></span>
    ${pending==='prof:'+p.id?`<div class="confirm"><button class="btn sm danger solid" data-act="profYes" data-id="${p.id}">Supprimer ${esc(p.name)} et ses mesures</button><button class="btn sm" data-act="cancel">Annuler</button></div>`:`<button class="btn sm danger" data-act="profDel" data-id="${p.id}">Supprimer</button>`}</div>`});
  h+=`</div><div class="card stack"><h2>Tout effacer</h2>${pending==='wipe'?`<div class="confirm"><button class="btn sm danger solid" data-act="wipeYes">Oui, tout effacer</button><button class="btn sm" data-act="cancel">Annuler</button></div>`:`<button class="btn danger" data-act="wipe">Effacer toutes les données</button>`}</div>`;
  return h;
}

function header(){
  if(view!=='home') return '';
  const p=prof();
  return `<div class="top"><span class="brand">${I.heart}Suivi Tension</span><button class="who" data-act="go" data-id="profiles" aria-label="Changer de personne, actuellement ${esc(p.name)}">${av(p,'s')}${esc(p.name)}</button></div>`;
}

function render(focus){
  if(!S.profiles.length) view='profiles';
  if(view==='between'&&!sess) view='home';
  const V={home:vHome,entry:vEntry,between:vBetween,history:vHistory,report:vReport,profiles:vProfiles,backup:vBackup}[view]||vHome;
  $('#app').innerHTML=header()+V();
  if(view==='entry') bindEntry();
  if(view==='between') startTimer();
  if(view==='profiles'&&addOpen){$('#pf').addEventListener('submit',createProfile); if(focus) $('#pname').focus()}
  if(focus===true && view==='entry') $('#sys').focus();
}

/* ---------- Saisie ---------- */
function bindEntry(){
  const order=['sys','dia','pulse'];
  order.forEach((id,i)=>{
    const el=$('#'+id);
    el.addEventListener('input',()=>{
      el.value=el.value.replace(/\D/g,'').slice(0,3);
      const v=el.value, n=+v;
      entryWarned=false; $('#saveBtn').textContent='Enregistrer'; liveWarn();
      if(v.length===3||(v.length===2&&n>=30)){ i<2?$('#'+order[i+1]).focus():$('#saveBtn').focus(); }
    });
  });
  $('#ef').addEventListener('submit',e=>{e.preventDefault();saveEntry()});
  liveWarn();
}
function liveWarn(){
  const s=+$('#sys').value, d=+$('#dia').value;
  $('#warn').innerHTML=(s>=180||d>=120)?`<div class="banner c-crit" role="alert"><strong>Valeur très élevée</strong><p class="small">Vérifiez les chiffres. Après l'enregistrement, l'app vous dira quoi faire.</p></div>`:'';
}
function saveEntry(){
  const s=+$('#sys').value, d=+$('#dia').value, pu=+$('#pulse').value||null;
  const w=$('#warn');
  if(!s||!d){w.innerHTML=`<div class="banner c-high"><strong>Il manque un chiffre</strong><p class="small">Entrez au moins le chiffre du haut et celui du bas.</p></div>`;(!s?$('#sys'):$('#dia')).focus();return}
  const issues=[];
  if(s<=d) issues.push("Le chiffre du haut est d'habitude plus grand que celui du bas.");
  if(s<60||s>260) issues.push('Le chiffre du haut semble inhabituel.');
  if(d<30||d>160) issues.push('Le chiffre du bas semble inhabituel.');
  if(pu&&(pu<30||pu>220)) issues.push('Le pouls semble inhabituel.');
  if(issues.length&&!entryWarned){
    entryWarned=true;
    w.innerHTML=`<div class="banner c-high" role="alert"><strong>Vérifiez ces valeurs</strong><p class="small">${issues.join(' ')}</p></div>`;
    $('#saveBtn').textContent='Enregistrer quand même';return;
  }
  const pid=prof().id, cont=sess&&sess.pid===pid;
  const dtEl=$('#dt'); let ts=Date.now();
  if(!cont&&dtEl&&dtEl.value){const t=new Date(dtEl.value).getTime(); if(!isNaN(t)) ts=t;}
  const arm=(document.querySelector('input[name=arm]:checked')||{}).value||'';
  const pos=(document.querySelector('input[name=pos]:checked')||{}).value||'';
  const note=$('#note').value.trim().slice(0,200);
  const id=uid();
  S.readings.push({id,pid,ts,sys:s,dia:d,pulse:pu,arm,pos,note});
  save();
  if(s>=180||d>=120) critShow=true;
  entryWarned=false; entryDraft=null;
  // Séance : la mesure suivante est attendue si l'heure est « maintenant » (pas une saisie rétroactive).
  const live=Math.abs(Date.now()-ts)<GAP;
  if(cont) sess.count++; else sess={pid,count:1,startTs:ts};
  sess.lastId=id;
  if(live&&sess.count<perSess()){
    sess.restUntil=Date.now()+60e3;
    view='between'; render(); window.scrollTo(0,0);
    if(!storageOK) toast('Attention : mesure non sauvegardée');
    return;
  }
  finishSession(id);
}
function finishSession(id){
  const pid=sess?sess.pid:prof().id;
  sess=null; view='home'; render(); window.scrollTo(0,0);
  const g=sessionWith(pid,id);
  const ns=storageOK?'':' (non sauvegardé)';
  if(g&&g.n>1) toast(`${I.check}Séance enregistrée : moyenne ${g.sys}/${g.dia} (${g.n} mesures)${ns}`);
  else if(g) toast(`${I.check}Enregistré : ${g.sys}/${g.dia}${g.pulse?`, pouls ${g.pulse}`:''}${ns}`);
}

/* ---------- Actions ---------- */
let tT;
function toast(html){const t=$('#toast');t.innerHTML=html;t.hidden=false;clearTimeout(tT);tT=setTimeout(()=>t.hidden=true,3200)}
function copy(text,okMsg,fallbackEl){
  const done=()=>toast(I.check+okMsg);
  const fb=()=>{if(fallbackEl){fallbackEl.hidden=false;fallbackEl.focus();fallbackEl.select();toast('Texte sélectionné : copiez-le avec le menu Copier.')}};
  try{navigator.clipboard.writeText(text).then(done,fb)}catch(e){fb()}
}
function createProfile(e){
  e.preventDefault();
  const name=$('#pname').value.trim();
  if(!name){$('#perr').textContent='Entrez un prénom.';$('#pname').focus();return}
  const color=(document.querySelector('input[name=pcol]:checked')||{}).value||COLORS[0];
  const p={id:uid(),name,rel:$('#prel').value.trim(),color};
  S.profiles.push(p); S.current=p.id; save(); addOpen=false; view='home'; render(); toast(I.check+`${esc(name)} ajouté`);
}
const A={
  go:id=>{
    pending=null; entryWarned=false;
    if(id!=='entry'&&sess){finishSession(sess.lastId); if(id==='home') return;}
    view=id; render(true); window.scrollTo(0,0);
  },
  next:()=>{view='entry';render(true);window.scrollTo(0,0)},
  endSess:()=>finishSession(sess&&sess.lastId),
  per:id=>{S.perSession=+id;save();render()},
  pick:id=>{S.current=id;save();view='home';critShow=false;render();window.scrollTo(0,0)},
  range:id=>{range=+id;render()},
  rep:id=>{repRange=+id;render()},
  pulse:()=>{showPulse=!showPulse;render()},
  critOk:()=>{critShow=false;render()},
  cancel:()=>{pending=null;render()},
  del:id=>{pending='del:'+id;render()},
  delYes:id=>{S.readings=S.readings.filter(r=>r.id!==id);pending=null;save();render();toast(I.check+'Mesure supprimée')},
  addToggle:()=>{addOpen=!addOpen;render(true)},
  removeSample:()=>{
    const sp=S.profiles.filter(p=>p.rel==='Exemple').map(p=>p.id);
    S.profiles=S.profiles.filter(p=>!sp.includes(p.id)); S.readings=S.readings.filter(r=>!sp.includes(r.pid));
    S.sample=false; S.current=S.profiles[0]?S.profiles[0].id:null; save();
    if(!S.profiles.length){addOpen=true;view='profiles'} render(true);
  },
  copyReport:()=>copy(reportText(reportData()),'Résumé copié',$('#repText')),
  copyBackup:()=>copy(JSON.stringify({app:'suivi-tension',v:1,at:new Date().toISOString(),perSession:perSess(),profiles:S.profiles,readings:S.readings}),'Sauvegarde copiée',null),
  restore:()=>{
    const raw=$('#restoreTxt').value.trim();
    try{const o=JSON.parse(raw); if(!Array.isArray(o.profiles)||!Array.isArray(o.readings)) throw 0; window.__restore=o; pending='restore'; render(); $('#restoreTxt').value=raw;}
    catch(e){$('#rerr').textContent="Ce texte n'est pas une sauvegarde valide. Copiez-la à nouveau en entier."}
  },
  restoreYes:()=>{const o=window.__restore; if(!o) return; S={profiles:o.profiles,readings:o.readings,current:(o.profiles[0]||{}).id,sample:false,perSession:o.perSession||2}; save(); pending=null; view='home'; render(); toast(I.check+'Sauvegarde restaurée')},
  profDel:id=>{pending='prof:'+id;render()},
  profYes:id=>{S.profiles=S.profiles.filter(p=>p.id!==id);S.readings=S.readings.filter(r=>r.pid!==id);if(S.current===id)S.current=S.profiles[0]?S.profiles[0].id:null;if(!S.profiles.some(p=>p.rel==='Exemple'))S.sample=false;pending=null;save();render()},
  wipe:()=>{pending='wipe';render()},
  wipeYes:()=>{S={profiles:[],readings:[],current:null,sample:false,perSession:perSess()};pending=null;save();addOpen=true;view='profiles';render(true)}
};
document.addEventListener('click',e=>{const b=e.target.closest('[data-act]'); if(!b) return; const f=A[b.dataset.act]; if(f){e.preventDefault(); f(b.dataset.id)}});

load(); render();
})();
</script>
<script>
if('serviceWorker' in navigator){window.addEventListener('load',function(){navigator.serviceWorker.register('./sw.js').catch(function(){});});}
</script>
</body>
</html>
